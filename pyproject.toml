[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "znn"
version = "0.1.0"
description = "CNN photo-z utilities: data transforms, robust stats, and model training"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn>=1.0.1",
    "tensorflow>=2.8.0",
    "matplotlib",
    "h5py",
    "scipy",
    "packaging",
]

[project.optional-dependencies]
qp = ["qp-prob>=1.0.1"]
test = ["pytest", "qp-prob>=1.0.1", "pyarrow"]

[tool.setuptools]
packages = ["znn"]

[tool.setuptools.package-data]
# pre-trained models shipped with the package (znn.load_pretrained)
znn = ["pretrained/*.keras"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"znn/__init__.py" = ["F401", "F403", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
